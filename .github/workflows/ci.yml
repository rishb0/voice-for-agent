name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax checks
        run: |
          python -m py_compile speak.py mcp_server.py hotkey.py tests/test_hotkey.py tests/test_voice.py
          bash -n install.sh menu.sh uninstall.sh bootstrap.sh tests/smoke_test.sh tests/test_selection.sh examples/claude-code.sh

      - name: Unit tests
        run: |
          python tests/test_hotkey.py
          python tests/test_voice.py
          bash tests/test_selection.sh

      - name: Unit template renders
        run: |
          sed -e 's|@ROOT_URI@|/tmp/repo|g' -e 's|@ROOT@|/tmp/repo|g' \
            -e 's|@PYTHON@|/usr/bin/python3|g' \
            systemd/voice-for-agent-hotkey.service.in >/tmp/unit.service
          ! grep -q '@' /tmp/unit.service
          grep -q '^ExecStart=' /tmp/unit.service

      - name: Text cleaner smoke test
        run: |
          output="$(python speak.py --clean-only '# Title Hello **world**.')"
          test -n "$output"
          printf '%s\n' "$output"
